# Packaging config for AI Workspace. See docs/specs/07-devops-release.md for
# the install/update requirements this implements.

appId: com.aiworkspace.desktop
productName: AI Workspace
directories:
  output: release

files:
  - out/**/*
  - package.json

win:
  target: nsis
  icon: resources/icon.ico
  # Hardcoded rather than built from ${productName} (which contains a
  # space electron-builder's own sanitizer doesn't strip) so the filename
  # is guaranteed byte-for-byte, matching the existing mac/linux artifacts.
  artifactName: 'AI-Workspace-Setup-${version}-win.${ext}'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  hardenedRuntime: true
  icon: resources/icon.icns

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png

publish:
  provider: github
