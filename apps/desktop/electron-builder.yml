# Packaging config for AI Workspace. See docs/specs/07-devops-release.md for
# the install/update requirements this implements.

appId: com.aiworkspace.desktop
productName: AI Workspace
directories:
  output: release

files:
  - out/**/*
  - package.json

win:
  target: nsis
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
  icon: resources/icon.icns

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: resources/icon.png

publish:
  provider: github
