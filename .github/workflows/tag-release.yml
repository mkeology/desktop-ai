name: Tag & Release

# Manually cuts a new version from `main`: bumps apps/desktop/package.json,
# commits that back to main, tags it, then builds and publishes installers
# for Windows/macOS/Linux in the same run — see
# docs/specs/07-devops-release.md.
#
# Why one workflow instead of relying on release.yml's tag-push trigger:
# the commit/tag this job pushes uses the default GITHUB_TOKEN, and GitHub
# deliberately does not let GITHUB_TOKEN-authored pushes re-trigger other
# workflows (loop prevention). So the release build happens right here.
#
# release.yml still exists as the manual fallback: pushing a v*.*.* tag
# yourself (with your own credentials) triggers it normally.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  tag:
    name: Bump version & tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        working-directory: apps/desktop
        # Don't capture `npm version`'s stdout for the tag — this project's
        # dependency tree makes npm print "npm warn deprecated ..." lines to
        # stdout during the lockfile resolution it does, which corrupts a
        # captured single-line value. Read the version back from
        # package.json instead, which is exact regardless of npm's noise.
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version --silent
          NEW_VERSION="v$(node -p "require('./package.json').version")"
          echo "tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git add apps/desktop/package.json
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.bump.outputs.tag }}"

  release:
    name: Build & publish (${{ matrix.os }})
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app bundle
        run: npm run build --if-present

      - name: Build & publish installers
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # A missing secret still becomes a *defined but empty* env var here,
        # and electron-builder mishandles a defined-but-empty CSC_LINK as
        # "sign with this path", crashing with "not a file" — setting
        # CSC_IDENTITY_AUTO_DISCOVERY: false does NOT prevent this (verified
        # in practice). It has to be genuinely unset, not just empty.
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK
          [ -z "$CSC_KEY_PASSWORD" ] && unset CSC_KEY_PASSWORD
          [ -z "$APPLE_ID" ] && unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npx --yes electron-builder --publish always
