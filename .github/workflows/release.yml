name: Release

# Builds and publishes installers for the desktop app (apps/desktop) for
# Windows, macOS, and Linux whenever a version tag (v1.2.3) is pushed.
# Requires a "build" script and an electron-builder "build" config in
# apps/desktop targeting all three platforms. The web app (landing page)
# is not built or deployed by this workflow — it has its own, separate
# deploy process once a hosting target is chosen.
#
# Secrets used if present (all optional — unsigned builds still work):
#   CSC_LINK / CSC_KEY_PASSWORD               macOS/Windows code signing cert
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD    macOS notarization
#   APPLE_TEAM_ID                             macOS notarization

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app bundle
        run: npm run build --if-present

      - name: Build & publish installers
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # A missing secret still becomes a *defined but empty* env var here,
        # and electron-builder mishandles a defined-but-empty CSC_LINK as
        # "sign with this path", crashing with "not a file" — setting
        # CSC_IDENTITY_AUTO_DISCOVERY: false does NOT prevent this (verified
        # in practice). It has to be genuinely unset, not just empty.
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK
          [ -z "$CSC_KEY_PASSWORD" ] && unset CSC_KEY_PASSWORD
          [ -z "$APPLE_ID" ] && unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          npx --yes electron-builder --publish always
