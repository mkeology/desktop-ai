name: Release

# Builds and publishes installers for the desktop app (apps/desktop) for
# Windows, macOS, and Linux whenever a version tag (v1.2.3) is pushed.
# Requires a "build" script and an electron-builder "build" config in
# apps/desktop targeting all three platforms. The web app (landing page)
# is not built or deployed by this workflow — it has its own, separate
# deploy process once a hosting target is chosen.
#
# Secrets used if present (all optional — unsigned builds still work):
#   CSC_LINK / CSC_KEY_PASSWORD               macOS/Windows code signing cert
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD    macOS notarization
#   APPLE_TEAM_ID                             macOS notarization

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app bundle
        run: npm run build --if-present

      - name: Build & publish installers
        run: npx --yes electron-builder --publish always
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # An empty (unset-secret) CSC_LINK is a defined-but-empty env var,
          # which electron-builder mishandles as "sign with this path" and
          # crashes on. Only let it look for a cert when one is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
